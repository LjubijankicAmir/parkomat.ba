# Sarajevo's paid street-parking zones, run by KJKP Rad.
#
# Each zone lists its parking stretches as they appear in the official list
# (parking-sarajevo.ba, "Popis ulica po zonama"). A stretch is either:
#   - a street: drawn as zone lines over the OpenStreetMap ways with that
#     name. `near` limits it to the ways around a point, for stretches that
#     are only part of a long street (or named after a landmark);
#   - a lot: a ramp-controlled lot, matched to the closest OpenStreetMap
#     parking area around `near`. Lots charge around the clock.
#
# A street over 800 m long with no `near` isn't drawn, because the paid part
# is unknown; the build lists it so someone can add an anchor.
#
# `verifiedAt` stays null until someone has checked the values on the street.

zones:
  - id: sarajevo-1
    number: 1
    name: Zona I
    sms:
      number: "0832001"
    pricePerHour: 3.00
    dailyTicket: 30.00
    # Monday to Saturday; Sundays and holidays are free.
    paidHours:
      - days: [mon, tue, wed, thu, fri, sat]
        from: "07:00"
        to: "22:00"
    maxStayMinutes: null
    sources:
      - https://rad.com.ba/usluge/javna-parkiralista-i-garaze
      - https://rad.com.ba/aktuelnosti/211/odluka-o-cijenama-koristenja-javnih-parkinga
      - https://parking-sarajevo.ba/javni-parkinzi/popis-ulica-po-zonama.html
