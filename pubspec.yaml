name: parkomat
description: Map-first parking app for Sarajevo and other cities in Bosnia and Herzegovina.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  auto_route: ^11.2.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: ^0.20.3

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  http: ^1.6.0
  injectable_generator: ^3.1.3
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/app_icon/parkomat-ios-1024.svg
    - assets/data/
    - assets/logo/

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
