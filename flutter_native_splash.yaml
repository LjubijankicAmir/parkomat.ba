flutter_native_splash:
  # Only the background: the logo animates in on the Flutter splash screen
  # (SplashScreen), which starts on exactly these colors, so the hand-off
  # from the native splash is invisible.
  color: "#EEF1F7"
  color_dark: "#0E1630"

  # Android 12+ always draws an icon on its splash. A transparent one keeps
  # it blank, like the other platforms.
  android_12:
    color: "#EEF1F7"
    color_dark: "#0E1630"
    image: assets/splash/parkomat-splash-android12-blank.png
